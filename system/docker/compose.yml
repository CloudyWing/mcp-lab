services:
  mcp-docker:
    container_name: mcp-docker
    profiles:
      - docker
    build:
      context: ../..
      dockerfile: system/docker/Dockerfile
      args:
        DOTNET_TAG: ${DOTNET_TAG:-10.0}
    extends:
      file: ../../policies/base.yml
      service: default-policy
    environment:
      MCPLAB_DOTENV_PATH: /app/config/service.env
      DOCKER_HOST: tcp://mcp-docker-proxy:2375
    depends_on:
      - mcp-docker-proxy
    volumes:
      - ../../config/mcp-docker:/app/config:ro
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_DOCKER_PORT:-9860}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    networks:
      - shared_net
      - docker_proxy_net

  # Only this proxy touches the Docker socket. It allows GET requests to ping, version, and containers,
  # and rejects every request that changes state (POST, DELETE, exec, and so on).
  mcp-docker-proxy:
    container_name: mcp-docker-proxy
    profiles:
      - docker
    image: ghcr.io/tecnativa/docker-socket-proxy:${DOCKER_PROXY_TAG:-v0.4.1}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,size=8m
      - /tmp:rw,nosuid,nodev,size=8m
    environment:
      PING: 1
      VERSION: 1
      CONTAINERS: 1
      EVENTS: 0
      INFO: 0
      POST: 0
      # The proxy is reached over the internal IPv4 network only; some hosts have no IPv6 support.
      DISABLE_IPV6: 1
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
    mem_limit: 64m
    cpus: 0.25
    networks:
      - docker_proxy_net

networks:
  docker_proxy_net:
    internal: true
